<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Student Records</title>
<style>body{font:18px Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px}input,select,button{font:inherit;margin:6px;padding:6px}table{border-collapse:collapse}th,td{border:1px solid #aaa;padding:10px}[hidden]{display:none}</style>
</head><body><h1>Student records</h1><form id="studentForm">
<label>Name <input id="name" required></label>
<label>Marks <input id="marks" type="number" min="0" max="100" required></label>
<button id="save">Save</button></form>
<table><thead><tr><th>Name</th><th>Marks</th></tr></thead><tbody id="records"></tbody></table>
<script>
const students = new Map();
document.getElementById('studentForm').onsubmit = event => {
 event.preventDefault();
 students.set(document.getElementById('name').value, document.getElementById('marks').value);
 const rows = document.getElementById('records'); rows.replaceChildren();
 let number = 0;
 for (const [name, marks] of students) {
  const row = rows.insertRow(); row.id = 'student-' + (++number);
  row.insertCell().textContent = name; row.insertCell().textContent = marks;
 }
};
</script></body></html>
